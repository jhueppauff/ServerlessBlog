name: build-editor

on:
    workflow_call:
      inputs:
        NODE_VERSION:
          required: false
          type: string
          default: '22.x'
        WORKING_DIRECTORY:
          type: string
          required: false
          default: 'Editor'

permissions:
  contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup node ${{ inputs.NODE_VERSION }}
              uses: actions/setup-node@v4
              with:
                node-version: ${{ inputs.NODE_VERSION }}
                cache: 'npm'
                cache-dependency-path: ${{ inputs.WORKING_DIRECTORY }}/package-lock.json

            - name: Install dependencies
              run: npm ci
              working-directory: ${{ inputs.WORKING_DIRECTORY }}

            - name: Lint
              run: npm run lint
              working-directory: ${{ inputs.WORKING_DIRECTORY }}

            - name: Test
              run: npm test
              working-directory: ${{ inputs.WORKING_DIRECTORY }}

            - name: Build
              run: npm run build
              working-directory: ${{ inputs.WORKING_DIRECTORY }}
